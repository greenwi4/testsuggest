openapi: 3.1.0
info:
  title: Petstore - OpenAPI 3.1
  description: >-
    This is a sample Pet Store Server based on the OpenAPI 3.1 specification.


    Some useful links:

    - [OpenAPI Reference](https://www.speakeasy.com/openapi)

    - [The Pet Store
    repository](https://github.com/swagger-api/swagger-petstore)

    - [The source API definition for the Pet
    Store](https://github.com/swagger-api/swagger-petstore/blob/master/src/main/resources/openapi.yaml)
  termsOfService: http://swagger.io/terms/
  contact:
    email: support@speakeasy.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
security:
  - api_key: []
servers:
  - url: https://{environment}.petstore.io
    description: A per-environment API.
    variables:
      environment:
        description: The environment name. Defaults to the production environment.
        default: prod
        enum:
          - prod
          - staging
          - dev
tags:
  - name: pet
    description: Everything about your Pets
    externalDocs:
      description: Find out more
      url: http://swagger.io
  - name: store
    description: Access to Petstore orders
    externalDocs:
      description: Find out more about our store
      url: http://swagger.io
  - name: user
    description: Operations about user
paths:
  /pet:
    put:
      tags:
        - pet
      summary: Update an existing pet
      description: Update an existing pet by Id
      operationId: updatePet
      requestBody:
        description: Update an existent pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.updatePet({
                  id: 10,
                  name: "doggie",
                  category: {
                    id: 1,
                    name: "Dogs",
                  },
                  photoUrls: [
                    "<value 1>",
                  ],
                });

                console.log(result);
              }

              run();
    post:
      tags:
        - pet
      summary: Add a new pet to the store
      description: Add a new pet to the store
      operationId: addPet
      requestBody:
        description: Create a new pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '405':
          description: Invalid input
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.addPet({
                  id: 10,
                  name: "doggie",
                  category: {
                    id: 1,
                    name: "Dogs",
                  },
                  photoUrls: [
                    "<value 1>",
                    "<value 2>",
                    "<value 3>",
                  ],
                });

                console.log(result);
              }

              run();
  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status
      description: Multiple status values can be provided with comma separated strings
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          explode: true
          schema:
            type: string
            default: available
            enum:
              - available
              - pending
              - sold
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.findPetsByStatus({});

                console.log(result);
              }

              run();
  /pet/findByTags:
    get:
      tags:
        - pet
      summary: Finds Pets by tags
      description: >-
        Multiple tags can be provided with comma separated strings. Use tag1,
        tag2, tag3 for testing.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.findPetsByTags();

                console.log(result);
              }

              run();
  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.getPetById({
                  petId: 311674,
                });

                console.log(result);
              }

              run();
    delete:
      tags:
        - pet
      summary: Deletes a pet
      description: ''
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          description: ''
          required: false
          schema:
            type: string
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pet deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.deletePet({
                  petId: 818965,
                });

                console.log(result);
              }

              run();
  /pet/{petId}/uploadImage:
    post:
      tags:
        - pet
      summary: uploads an image
      description: ''
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
        - name: additionalMetadata
          in: query
          description: Additional Metadata
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.pet.uploadFile({
                  petId: 150516,
                });

                console.log(result);
              }

              run();
  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status
      description: Returns a map of status codes to quantities
      operationId: getInventory
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.store.getInventory();

                console.log(result);
              }

              run();
  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet
      description: Place a new order in the store
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: Invalid input
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.store.placeOrder({
                  id: 10,
                  petId: 198772,
                  quantity: 7,
                  status: "approved",
                });

                console.log(result);
              }

              run();
  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find purchase order by ID
      description: >-
        For valid response try integer IDs with value <= 5 or > 10. Other values
        will generate exceptions.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of order that needs to be fetched
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.store.getOrderById({
                  orderId: 728529,
                });

                console.log(result);
              }

              run();
    delete:
      tags:
        - store
      summary: Delete purchase order by ID
      description: >-
        For valid response try integer IDs with value < 1000. Anything above
        1000 or nonintegers will generate API errors
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order that needs to be deleted
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.store.deleteOrder({
                  orderId: 690575,
                });

                console.log(result);
              }

              run();
  /user:
    post:
      tags:
        - user
      summary: Create user
      description: This can only be done by the logged in user.
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.user.createUser({
                  id: 10,
                  username: "theUser",
                  firstName: "John",
                  lastName: "James",
                  email: "john@email.com",
                  password: "12345",
                  phone: "12345",
                  userStatus: 1,
                });

                console.log(result);
              }

              run();
  /user/createWithList:
    post:
      tags:
        - user
      summary: Creates list of users with given input array
      description: Creates list of users with given input array
      operationId: createUsersWithListInput
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.user.createUsersWithListInput([
                  {
                    id: 10,
                    username: "theUser",
                    firstName: "John",
                    lastName: "James",
                    email: "john@email.com",
                    password: "12345",
                    phone: "12345",
                    userStatus: 1,
                  },
                ]);

                console.log(result);
              }

              run();
  /user/login:
    get:
      tags:
        - user
      summary: Logs user into the system
      description: ''
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user name for login
          required: false
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.user.loginUser();

                console.log(result);
              }

              run();
  /user/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session
      description: ''
      operationId: logoutUser
      parameters: []
      responses:
        '200':
          description: successful operation
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                await petstore.user.logoutUser();


              }

              run();
  /user/{username}:
    get:
      tags:
        - user
      summary: Get user by user name
      description: ''
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: 'The name that needs to be fetched. Use user1 for testing. '
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.user.getUserByName({
                  username: "Edyth10",
                });

                console.log(result);
              }

              run();
    put:
      tags:
        - user
      summary: Update user
      description: This can only be done by the logged in user.
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: name that needs to be updated
          required: true
          schema:
            type: string
      requestBody:
        description: Update an existent user in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: successful operation
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                await petstore.user.updateUser({
                  username: "Alison.Cassin",
                  body: {
                    id: 10,
                    username: "theUser",
                    firstName: "John",
                    lastName: "James",
                    email: "john@email.com",
                    password: "12345",
                    phone: "12345",
                    userStatus: 1,
                  },
                });


              }

              run();
    delete:
      tags:
        - user
      summary: Delete user
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: The name that needs to be deleted
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-readme:
        code-samples:
          - name: Typescript (SDK)
            language: javascript
            code: |-
              import { Petstore } from "petstore";

              const petstore = new Petstore({
                apiKey: process.env["PETSTORE_API_KEY"] ?? "",
              });

              async function run() {
                const result = await petstore.user.deleteUser({
                  username: "Rita_Schuppe",
                });

                console.log(result);
              }

              run();
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: '12345'
        phone:
          type: string
          example: '12345'
        userStatus:
          type: integer
          description: User Status
          format: int32
          example: 1
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Pet:
      required:
        - name
        - photoUrls
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
    ApiErrorInvalidInput:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad request
    ApiErrorNotFound:
      type: object
      required:
        - status
        - error
        - code
      properties:
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        code:
          type: string
          example: object_not_found
    ApiErrorUnauthorized:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: integer
          format: int32
          example: 401
        error:
          type: string
          example: Unauthorized
  responses:
    Unauthorized:
      description: Unauthorized error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorUnauthorized'
    NotFound:
      description: Not Found error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorNotFound'
    InvalidInput:
